<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pental Shop Lab-3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <h1>Welcome to Pental Shop Lab-3</h1>
 
    <section class="about">
        <h2>About This Lab</h2>
 
        <p>
            In this lab, you will learn basic HTML structure,
            formatting text, creating simple tables, and using
            forms for input.
        </p>
 
        <table>
            <tr>
                <th>Item Name</th>
                <th>Quantity</th>
                <th>Status</th>
            </tr>
 
            <tr>
                <td>Pencils</td>
                <td>100</td>
                <td>In Stock</td>
            </tr>
 
            <tr>
                <td>Notebooks</td>
                <td>50</td>
                <td>Low Stock</td>
            </tr>
 
            <tr>
                <td>Markers</td>
                <td>15</td>
                <td>In Stock</td>
            </tr>
        </table>
    </section>
 
    <div class="contact-box">
 
        <h2>Contact Information</h2>
 
        <div class="form-row">
            <label>Name</label>
            <input type="text">
        </div>
 
        <div class="form-row">
            <label>Email</label>
            <input type="email">
        </div>
 
        <div class="form-row">
            <label>Message</label>
            <textarea></textarea>
        </div>
 
        <button>Submit</button>
 
    </div>
 
</body>
</html>
